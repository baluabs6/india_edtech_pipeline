apiVersion: v1
kind: ServiceAccount
metadata:
  name: edtech-india-api-sa
  namespace: edtech
  annotations:
    azure.workload.identity/client-id: "<terraform output: workload_identity_client_id>"
  labels:
    azure.workload.identity/use: "true"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: edtech-keyvault-provider
  namespace: edtech
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "<terraform output: workload_identity_client_id>"
    keyvaultName: "<terraform output: key_vault_name>"
    tenantId: "<terraform output: workload_identity_tenant_id>"
    objects: |
      array:
        - |
          objectName: PG-HOST
          objectType: secret
        - |
          objectName: PG-USER
          objectType: secret
        - |
          objectName: PG-PASSWORD
          objectType: secret
        - |
          objectName: MONGO-URI
          objectType: secret
        - |
          objectName: AZURE-OPENAI-ENDPOINT
          objectType: secret
        - |
          objectName: AZURE-OPENAI-API-KEY
          objectType: secret
        - |
          objectName: API-KEY
          objectType: secret
        - |
          objectName: AZURE-LANGUAGE-ENDPOINT
          objectType: secret
        - |
          objectName: AZURE-LANGUAGE-KEY
          objectType: secret
        - |
          objectName: WHATSAPP-VERIFY-TOKEN
          objectType: secret
        - |
          objectName: WHATSAPP-ACCESS-TOKEN
          objectType: secret
        - |
          objectName: WHATSAPP-PHONE-NUMBER-ID
          objectType: secret
        - |
          objectName: WHATSAPP-APP-SECRET
          objectType: secret
        - |
          objectName: JWT-SECRET
          objectType: secret
        - |
          objectName: CLIENT-CREDENTIALS-JSON
          objectType: secret
        - |
          objectName: SMTP-HOST
          objectType: secret
        - |
          objectName: SMTP-USER
          objectType: secret
        - |
          objectName: SMTP-PASSWORD
          objectType: secret
        - |
          objectName: ALERT-FROM-EMAIL
          objectType: secret
        - |
          objectName: ALERT-TO-EMAILS
          objectType: secret
  # Mirrors Key Vault secrets into a native K8s Secret so they can be
  # consumed as env vars (envFrom) exactly like before, but the values
  # never live in source control or `kubectl apply` manifests.
  secretObjects:
    - secretName: edtech-secrets
      type: Opaque
      data:
        - objectName: PG-HOST
          key: PG_HOST
        - objectName: PG-USER
          key: PG_USER
        - objectName: PG-PASSWORD
          key: PG_PASSWORD
        - objectName: MONGO-URI
          key: MONGO_URI
        - objectName: AZURE-OPENAI-ENDPOINT
          key: AZURE_OPENAI_ENDPOINT
        - objectName: AZURE-OPENAI-API-KEY
          key: AZURE_OPENAI_API_KEY
        - objectName: API-KEY
          key: API_KEY
        - objectName: AZURE-LANGUAGE-ENDPOINT
          key: AZURE_LANGUAGE_ENDPOINT
        - objectName: AZURE-LANGUAGE-KEY
          key: AZURE_LANGUAGE_KEY
        - objectName: WHATSAPP-VERIFY-TOKEN
          key: WHATSAPP_VERIFY_TOKEN
        - objectName: WHATSAPP-ACCESS-TOKEN
          key: WHATSAPP_ACCESS_TOKEN
        - objectName: WHATSAPP-PHONE-NUMBER-ID
          key: WHATSAPP_PHONE_NUMBER_ID
        - objectName: WHATSAPP-APP-SECRET
          key: WHATSAPP_APP_SECRET
        - objectName: JWT-SECRET
          key: JWT_SECRET
        - objectName: CLIENT-CREDENTIALS-JSON
          key: CLIENT_CREDENTIALS_JSON
        - objectName: SMTP-HOST
          key: SMTP_HOST
        - objectName: SMTP-USER
          key: SMTP_USER
        - objectName: SMTP-PASSWORD
          key: SMTP_PASSWORD
        - objectName: ALERT-FROM-EMAIL
          key: ALERT_FROM_EMAIL
        - objectName: ALERT-TO-EMAILS
          key: ALERT_TO_EMAILS
