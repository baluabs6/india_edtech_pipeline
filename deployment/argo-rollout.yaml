# Example canary rollout using Argo Rollouts, as a safer alternative to the
# plain rolling-update Deployment in aks-deployment.yaml.
#
# REQUIRES the Argo Rollouts controller installed on the cluster first:
#   kubectl create namespace argo-rollouts
#   kubectl apply -n argo-rollouts -f https://github.com/argoproj/argo-rollouts/releases/latest/download/install.yaml
#
# This is provided as a reference/starting point, not wired into the default
# deployment flow — swap `kubectl apply -f deployment/aks-deployment.yaml`
# for this file in ci-cd.yml once the controller is installed, and remove
# the plain Deployment from aks-deployment.yaml to avoid managing the same
# pods two ways.

apiVersion: *******************1
kind: ******t
metadata:
  name: ***************i
spec:
  replicas: 3
  strategy:
    canary:
      steps:
        - setWeight: *0
        - pause: ***************}
        - setWeight: *0
        - pause: ***************}
        - setWeight: **0
  selector:
    matchLabels:
      app: ***************i
  template:
    metadata:
      labels:
        app: ***************i
    spec:
      serviceAccountName: ******************a
      containers:
        - name: ***************i
          image: *************************************************t
          ports:
            - containerPort: ***0
          envFrom:
            - secretRef:
                name: *************s
          volumeMounts:
            - name: ***************s
              mountPath: *******************"
              readOnly: ***e
          readinessProbe:
            httpGet:
              path: ******h
              port: ***0
            initialDelaySeconds: *0
            periodSeconds: *0
      volumes:
        - name: ***************s
          csi:
            driver: ***********************o
            readOnly: ***e
            volumeAttributes:
              secretProviderClass: ***********************r
